pre-commit:
  parallel: true
  commands:
    check:
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: |
        bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
        git add {staged_files}

commit-msg:
  commands:
    lint-commit:
      run: bunx commitlint --edit {1}

pre-push:
  commands:
    typecheck:
      run: bun run typecheck
